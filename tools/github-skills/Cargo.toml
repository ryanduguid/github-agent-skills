[package]
name = "github-skills"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Skill validator, synchroniser and public-file checker for the portable GitHub skills"
publish = false

[dependencies]
fancy-regex = "=0.19.2"
serde_json = "1"
sha2 = "=0.11.1"

# Hard links are counted through the Win32 API; the standard library's count is unstable there.
[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
