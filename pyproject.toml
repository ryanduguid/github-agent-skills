# Tool configuration only. This repository is not a Python package.

[tool.ruff]
src = ["scripts", "tests", "fuzz"]
target-version = "py314"

[tool.ruff.lint]
# Ruff's default set plus import sorting: pycodestyle errors that are not
# formatting opinions (E4, E7, E9), all of pyflakes (F), and isort (I).
select = ["E4", "E7", "E9", "F", "I"]
