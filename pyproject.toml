# Tool configuration only. This repository is not a Python package.

[tool.ruff]
src = ["tests"]
target-version = "py314"

[tool.ruff.lint]
# Ruff's default set plus import sorting: pycodestyle errors that are not
# formatting opinions (E4, E7, E9), all of pyflakes (F), and isort (I).
select = ["E4", "E7", "E9", "F", "I"]

# The skill's helper scripts run on the user's own Python, from 3.8 on, so Ruff
# reports syntax newer than that there; CI runs their tests on Python 3.8.
[tool.ruff.per-file-target-version]
"**/skills/*/scripts/*.py" = "py38"
