version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor and patch action updates arrive as one pull request, so they need
      # one rebase and CI run instead of one each. Majors stay separate for review.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The release-policy pin is an immutable full commit SHA, advanced only
      # by a reviewed re-pin of its workflow family. A Dependabot bump adds an
      # unapproved SHA to the portfolio audit without changing the workflow,
      # so re-pin by hand instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"
  # The hash-pinned dev tool in requirements-lint.txt: ruff.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The checker and its separately locked cargo-fuzz crate.
  - package-ecosystem: cargo
    directories:
      - /tools/github-skills
      - /tools/github-skills/fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # As for actions: minor and patch updates arrive as one pull request.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # These exact pins are normal dependencies of the checker, so they also
      # sit in fuzz/Cargo.lock. Dependabot's fuzz job does not edit the parent
      # manifest and its checker job does not edit that lock, so a bump fails
      # CI's --locked fuzz lint. Bump them by hand and refresh both locks.
      - dependency-name: fancy-regex
      - dependency-name: sha2
