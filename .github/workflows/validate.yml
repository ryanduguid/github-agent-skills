name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # The weekly run gives the fuzzer time on main even when nothing merges.
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install the hash-pinned linter
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=ruff --requirement requirements-lint.txt
      - name: Ruff
        run: python -m ruff check .

  validate:
    # The 3.14 leg reports as bare "validate". Branch protection requires validate-gates instead.
    name: validate${{ matrix.python != '3.14' && format(' ({0})', matrix.python) || '' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Strict validation
        run: python scripts/validate_skills.py --strict
      - name: Check public files
        run: python scripts/check_public_files.py
  windows-sync-safety:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Exercise NTFS junction safety
        run: python -m unittest tests.test_sync_skills.SyncSkillsTests -v

  # The native Rust candidate in tools/github-skills. The Python scripts stay
  # the live checks; this job keeps the candidate building and in parity.
  native:
    name: native (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: tools/github-skills
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Build the contract probe
        run: cargo build --locked --examples
      - name: Replay the original Python assertions against the native candidate
        working-directory: .
        run: >-
          python tools/github-skills/tests/original_contract.py --root .
          --probe tools/github-skills/target/debug/examples/contract_probe
          --binary tools/github-skills/target/debug/github-skills
          --record "$RUNNER_TEMP/native-contract-results.json"

  # Measures the unit tests' branch coverage for the Codecov badge. It runs
  # apart from the other jobs so their commands stay unchanged.
  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install the hash-pinned coverage tool
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=coverage --requirement requirements-coverage.txt
      - name: Run the unit tests under branch coverage
        run: python -m coverage run --branch --source=scripts -m unittest discover -s tests
      - name: Report coverage
        run: python -m coverage report --fail-under=100
      - name: Write coverage for Codecov
        run: python -m coverage xml -o coverage-codecov.xml
      - name: Keep the coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.xml
          retention-days: 1

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from validate-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: coverage
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml
          disable_search: true
          fail_ci_if_error: true

  fuzzing:
    name: fuzz the public-file scanner
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs after merge, weekly and on demand rather than on pull requests.
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the pinned fuzzer
        run: >-
          python -m pip install --require-hashes --only-binary :all:
          --requirement requirements-fuzz.txt
      - name: Fuzz the scanner
        run: >-
          python -m fuzz.public_files fuzz/corpus
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  validate-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [lint, validate, windows-sync-safety, native, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/validate.yml validate-gates --exempt codecov --exempt fuzzing
