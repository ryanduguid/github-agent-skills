name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check PowerShell
        shell: pwsh
        run: $PSVersionTable.PSVersion
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Incremental validation
        run: python scripts/validate_skills.py
      - name: Strict validation
        run: python scripts/validate_skills.py --strict
      - name: Check public files
        run: python scripts/check_public_files.py
      - name: Check generated runtime copies
        shell: pwsh
        run: pwsh -File scripts/sync-skills.ps1 -Check
  windows-sync-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Exercise NTFS junction safety
        run: python -m unittest tests.test_sync_skills.SyncSkillsTests.test_sync_rejects_linked_approved_child_before_any_mutation tests.test_sync_skills.SyncSkillsTests.test_sync_rejects_nested_linked_destination_descendant tests.test_sync_skills.SyncSkillsTests.test_sync_rejects_nested_canonical_link_before_copy -v
