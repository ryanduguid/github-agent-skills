name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # The weekly run gives the fuzzer its time on main.
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install the hash-pinned linter
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=ruff --requirement requirements-lint.txt
      - name: Ruff
        run: python -m ruff check .
      # actionlint runs shellcheck over the workflows' run: scripts; the
      # repository tracks no shell files of its own. Each release asset is
      # checked against the digest recorded at pin time (koalaman publishes
      # no checksums file).
      - name: Lint the workflows with pinned actionlint and ShellCheck
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum --check
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -shellcheck "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

  validate:
    # The 3.14 leg reports as bare "validate". Branch protection requires validate-gates instead.
    name: validate${{ matrix.python != '3.14' && format(' ({0})', matrix.python) || '' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      # Each single-line run below is a README Repository checks command, in
      # order; check-public-files fails when the two lists differ.
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Strict validation
        run: cargo run --manifest-path tools/github-skills/Cargo.toml --locked -- validate-skills --strict
      - name: Check public files
        run: cargo run --manifest-path tools/github-skills/Cargo.toml --locked -- check-public-files

  # removed-jobs: windows-sync-safety
  # The native job's Windows leg runs the NTFS junction safety tests that
  # windows-sync-safety ran with Python.

  # The checks in tools/github-skills: formatting, Clippy, the tests and the
  # release build, on Linux and on Windows, where links are NTFS junctions.
  # On Linux it also lints the fuzz target, which has its own workspace, so a
  # change that breaks it fails here rather than in the weekly fuzz run.
  native:
    name: native (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: tools/github-skills
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Restore the dependency build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/github-skills
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - if: runner.os == 'Linux'
        run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --all-targets -- -D warnings

  # Measures the native tests' line coverage for the Codecov badge. It runs
  # apart from the native job so that job's commands stay unchanged.
  coverage:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/github-skills
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and its coverage tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - name: Install the pinned cargo-llvm-cov
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      # The floor is the measured line coverage, rounded down (96.87% on Linux, 4 November 2026).
      # Raise it with the tests, never lower it to pass.
      - name: Run the native tests with line coverage
        run: cargo llvm-cov --locked --lcov --output-path coverage-rust-${{ runner.os }}.lcov --fail-under-lines 96
      - name: Use repository paths in both coverage reports
        shell: pwsh
        run: |
          $report = "coverage-rust-$env:RUNNER_OS.lcov"
          $prefix = $env:GITHUB_WORKSPACE.Replace([IO.Path]::DirectorySeparatorChar, '/').TrimEnd('/') + '/'
          $lines = Get-Content -LiteralPath $report | ForEach-Object {
            if ($_.StartsWith('SF:')) {
              $path = $_.Substring(3).Replace([IO.Path]::DirectorySeparatorChar, '/')
              if (-not $path.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
                throw 'Coverage source is outside the repository'
              }
              'SF:' + $path.Substring($prefix.Length)
            } else { $_ }
          }
          $lines | Set-Content -LiteralPath $report -Encoding utf8
      - name: Keep the coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov-${{ runner.os }}
          path: tools/github-skills/coverage-rust-${{ runner.os }}.lcov
          retention-days: 1

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from validate-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: coverage
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-codecov-*
          merge-multiple: true
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-rust-Linux.lcov,coverage-rust-Windows.lcov
          disable_search: true
          fail_ci_if_error: true

  fuzzing:
    name: fuzz the public-file scanner
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs weekly and on demand rather than on pull requests or pushes.
    # validate-gates exempts this job, so a skipped run leaves main green.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/github-skills
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer instrumentation needs a nightly compiler; the date is pinned.
      - name: Install the pinned fuzzer
        env:
          CARGO_FUZZ_VERSION: "0.13.2"
          # install-action has no cargo-fuzz manifest, so the release asset is
          # checked against GitHub's digest for it at pin time.
          CARGO_FUZZ_SHA256: "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c"
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-10-15 --profile minimal
          asset="cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/$asset"
          echo "${CARGO_FUZZ_SHA256}  $asset" | sha256sum --check
          tar -xzf "$asset" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-fuzz
      # The cargo-fuzz release binary is built for musl and defaults to that
      # target, where the address sanitiser cannot build; fuzz on glibc instead.
      - name: Fuzz the scanner
        run: >-
          cargo +nightly-2026-10-15 fuzz run --target x86_64-unknown-linux-gnu public_files fuzz/corpus --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  validate-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [lint, validate, native, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/validate.yml validate-gates --exempt codecov --exempt fuzzing
