name: Feature request
description: Propose a focused, evidence-based improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Describe the workflow gap with a minimal sanitised example. Do not include client, taxpayer, employee or payroll data, taxpayer identifiers such as tax file numbers, credentials or private repository contents. Do not attach confidential files.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary
      options:
        - label: This proposal does not require an unapproved remote mutation.
          required: true
